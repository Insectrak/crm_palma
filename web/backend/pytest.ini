[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=39
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers personalizados — registrar aqui para que --strict-markers no falle.
# CMMI Level 3: cada test de regresion debe estar atado al bug que cubre.
# Ver tests/CONTRIBUTING.md para cuando usar cada marker.
markers =
    unit: test unitario puro (funcion aislada, sin DB ni HTTP)
    auth: tests del modulo de autenticacion (login, JWT, roles, users CRUD)
    leads: tests del modulo de leads
    ingest: tests del endpoint multi-tenant /api/ingest/leads
    notification: tests del modulo de notificaciones (FCM, coalescer)
    regression: regresion historica (incluir Bug ID en docstring del test)
    integration: requiere DB real o servicios externos (excluido por default)
    slow: test que tarda >5s (excluido en CI rapido)
