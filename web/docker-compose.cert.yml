# docker-compose.cert.yml — CERTIFICACION (rama: cert / EasyPanel: crm_cert)
# Uso: docker compose -f docker-compose.cert.yml up --build

services:
  crm-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend-cert
    ports:
      - "8011:8001"
    env_file:
      - ./backend/.env.cert
    restart: unless-stopped
    networks:
      - crm-cert-net

  crm-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    container_name: crm-frontend-cert
    ports:
      - "3011:80"
    depends_on:
      - crm-backend
    restart: unless-stopped
    networks:
      - crm-cert-net

networks:
  crm-cert-net:
    driver: bridge
